<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 CINEMA | Premium Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #050811; color: white; scroll-behavior: smooth; }
        .movie-gradient { background: linear-gradient(to top, #050811 0%, transparent 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); transition: 0.4s; }
        .glass-card:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-10px); border-color: #3b82f6; }
    </style>
</head>
<body>

    <nav class="fixed w-full z-50 px-6 py-4 flex justify-between items-center transition-all bg-black/50 backdrop-blur-md">
        <div class="text-3xl font-black tracking-tighter text-blue-500 italic">404<span class="text-white">CINEMA</span></div>
        <div class="hidden md:flex gap-8 text-sm font-light tracking-widest uppercase">
            <a href="#" class="hover:text-blue-500">Home</a>
            <a href="#action" class="hover:text-blue-500">Action</a>
            <a href="#vlog" class="hover:text-blue-500">Vlogs</a>
            <a href="#shortfilm" class="hover:text-blue-500">Short Films</a>
        </div>
        <button class="bg-blue-600 p-2 rounded-full px-5 text-xs font-bold uppercase">Subscribe</button>
    </nav>

    <header class="relative h-[80vh] flex items-end pb-20 px-6 md:px-12">
        <video autoplay muted loop class="absolute inset-0 w-full h-full object-cover opacity-50">
            <source src="https://drive.google.com/uc?export=download&id=1WFCoSWozt4vngbNO4tKQQw-9rytk3qA5" type="video/mp4">
        </video>
        <div class="absolute inset-0 movie-gradient"></div>
        
        <div class="relative z-10 max-w-3xl">
            <span class="bg-blue-600 text-[10px] px-3 py-1 rounded-full font-bold uppercase tracking-widest">New Release</span>
            <h1 class="text-5xl md:text-7xl font-bold mt-4 mb-6 leading-tight">THE BEGINNING OF <br><span class="text-blue-500">404 STUDIO</span></h1>
            <p class="text-gray-400 text-lg mb-8 leading-relaxed">เบื้องหลังการทำงานและจุดเริ่มต้นของสตูดิโอเล็กๆ ที่สร้างสรรค์ผลงานภาพยนตร์สั้นระดับคุณภาพ</p>
            <div class="flex gap-4">
                <button onclick="playMovie('https://drive.google.com/uc?export=download&id=1WFCoSWozt4vngbNO4tKQQw-9rytk3qA5')" class="bg-white text-black px-8 py-3 rounded-lg font-bold hover:bg-blue-500 hover:text-white transition">PLAY NOW</button>
                <button class="bg-white/10 backdrop-blur-md px-8 py-3 rounded-lg font-bold border border-white/20 hover:bg-white/20 transition">DETAILS</button>
            </div>
        </div>
    </header>

    <section id="action" class="py-12 px-6 md:px-12">
        <h2 class="text-2xl font-semibold mb-8 border-l-4 border-blue-600 pl-4">ACTION MOVIES</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
            <div onclick="playMovie('YOUR_VIDEO_URL')" class="glass-card rounded-xl overflow-hidden cursor-pointer group">
                <div class="relative aspect-[2/3]">
                    <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=500" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition">
                        <span class="text-4xl">▶</span>
                    </div>
                </div>
                <div class="p-4">
                    <h3 class="text-sm font-semibold">Mission 404</h3>
                    <p class="text-[10px] text-gray-500 mt-1">2026 • 15 min</p>
                </div>
            </div>
            </div>
    </section>

    <section id="vlog" class="py-12 px-6 md:px-12 bg-white/[0.02]">
        <h2 class="text-2xl font-semibold mb-8 border-l-4 border-blue-600 pl-4">MY VLOGS</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div onclick="playMovie('VLOG_URL')" class="glass-card rounded-xl overflow-hidden cursor-pointer h-64 relative group">
                <img src="https://images.unsplash.com/photo-1492691523567-6170f0275df1?q=80&w=800" class="w-full h-full object-cover opacity-60 group-hover:scale-110 transition duration-700">
                <div class="absolute bottom-0 p-6">
                    <h3 class="text-xl font-bold">Trip to Malaysia</h3>
                    <p class="text-sm text-blue-400">Behind the scenes</p>
                </div>
            </div>
            </div>
    </section>

    <div id="videoModal" class="hidden fixed inset-0 z-[100] bg-black/95 flex items-center justify-center p-4">
        <div class="relative w-full max-w-5xl">
            <button onclick="closeMovie()" class="absolute -top-12 right-0 text-white text-3xl hover:text-blue-500">✕</button>
            <div class="rounded-2xl overflow-hidden shadow-2xl border border-white/10 bg-black">
                <video id="mainPlayer" controls class="w-full aspect-video"></video>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('videoModal');
        const player = document.getElementById('mainPlayer');

        function playMovie(url) {
            player.src = url;
            modal.classList.remove('hidden');
            player.play();
        }

        function closeMovie() {
            modal.classList.add('hidden');
            player.pause();
            player.src = "";
        }
    </script>
</body>
</html>
