<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>404Cinema</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="data.js"></script>

<style>
.scrollbar-hide::-webkit-scrollbar {
  display: none;
}
</style>

</head>

<body class="bg-black text-white">

<!-- 🔥 Navbar -->
<nav class="flex justify-between items-center px-6 py-4 bg-black fixed w-full z-50">
  <h1 class="text-red-600 text-2xl font-bold">404Cinema</h1>
  <input id="search" placeholder="ค้นหา..."
    class="px-3 py-1 text-black rounded">
</nav>

<div class="pt-20"></div>

<!-- 🎬 Hero -->
<div class="relative h-[70vh] flex items-end px-10">
  <img src="img/123.jpg"
       class="absolute w-full h-full object-cover opacity-40">

  <div class="relative z-10 mb-10">
    <h1 class="text-6xl font-bold mb-4">🔥 FEATURED</h1>
    <p class="max-w-xl mb-4 text-gray-300">
      หนังระดับพรีเมียม ดูได้ไม่อั้น
    </p>
  </div>
</div>

<!-- 🎞️ ROWS -->
<div class="px-6 space-y-10 mt-6">

  <div>
    <h2 class="text-xl mb-3">🔥 Trending</h2>
    <div id="row-all" class="flex gap-4 overflow-x-auto scrollbar-hide"></div>
  </div>

  <div>
    <h2 class="text-xl mb-3">💥 Bball</h2>
    <div id="row-action" class="flex gap-4 overflow-x-auto scrollbar-hide"></div>
  </div>

  <div>
    <h2 class="text-xl mb-3">📹 Vlogs</h2>
    <div id="row-vlogs" class="flex gap-4 overflow-x-auto scrollbar-hide"></div>
  </div>

</div>

<script>

// 🎬 สร้างการ์ด (Netflix style)
function createCard(m) {
  return `
    <div class="relative min-w-[220px] group cursor-pointer"
      onclick="openPlayer('${m.video}')">

      <img src="${m.thumbnail}"
        class="rounded-lg transition duration-300 group-hover:scale-125 z-10 relative">

      <!-- preview -->
      <video class="absolute top-0 left-0 w-full h-full object-cover opacity-0 
        group-hover:opacity-100 transition duration-300 rounded-lg"
        muted loop
        onmouseenter="playPreview(this)"
        onmouseleave="stopPreview(this)">
        <source src="${m.preview}" type="video/mp4">
      </video>

      <!-- overlay -->
      <div class="absolute inset-0 bg-black bg-opacity-70 opacity-0 
        group-hover:opacity-100 transition p-3 flex flex-col justify-end rounded-lg">

        <p class="font-bold">${m.title}</p>

        <div class="flex gap-2 mt-2">
          <button class="bg-white text-black px-2 py-1 rounded">▶</button>
          <button class="bg-gray-700 px-2 py-1 rounded">+</button>
        </div>
      </div>

    </div>
  `;
}

// 🎞️ render row
function renderRow(id, list) {
  const container = document.getElementById(id);
  container.innerHTML = "";
  list.forEach(m => {
    container.innerHTML += createCard(m);
  });
}

// 🎬 เปิด player
function openPlayer(video) {
  window.location.href = "player.html?video=" + video;
}

// 🎥 delay preview (Netflix feel)
let previewTimeout;

function playPreview(video) {
  previewTimeout = setTimeout(() => {
    video.play();
  }, 500);
}

function stopPreview(video) {
  clearTimeout(previewTimeout);
  video.pause();
  video.currentTime = 0;
}

// 🔍 search
document.getElementById("search").addEventListener("input", e => {
  const val = e.target.value.toLowerCase();
  const filtered = movies.filter(m => m.title.toLowerCase().includes(val));

  renderRow("row-all", filtered);
  renderRow("row-Bball", filtered.filter(m => m.category === "action"));
  renderRow("row-vlogs", filtered.filter(m => m.category === "vlogs"));
});

// โหลดครั้งแรก
renderRow("row-all", movies);
renderRow("row-Bball", movies.filter(m => m.category === "action"));
renderRow("row-vlogs", movies.filter(m => m.category === "vlogs"));

</script>

</body>
</html>
