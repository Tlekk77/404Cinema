<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>404Cinema</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="data.js"></script>

</head>

<body class="bg-black text-white">

<!-- 🔍 Navbar -->
<nav class="flex justify-between p-4 bg-gray-900">
  <h1 class="text-red-600 text-xl">404Cinema</h1>
  <input id="search" type="text" placeholder="ค้นหาหนัง..."
    class="px-3 py-1 text-black rounded">
</nav>

<!-- 🎞️ หมวด -->
<div class="p-4">
  <button onclick="filter('all')" class="mr-2">ทั้งหมด</button>
  <button onclick="filter('action')" class="mr-2">Action</button>
  <button onclick="filter('vlogs')" class="mr-2">Vlogs</button>
</div>

<!-- 🎬 หนัง -->
<div id="movieList" class="flex gap-4 overflow-x-auto p-4"></div>

<script>

// แสดงหนัง
function render(list) {
  const container = document.getElementById("movieList");
  container.innerHTML = "";

  list.forEach(m => {
    container.innerHTML += `
      <div class="relative min-w-[200px] cursor-pointer"
        onclick="openPlayer('${m.video}')">

        <img src="${m.thumbnail}" class="rounded-lg">

        <!-- 🎥 Preview -->
        <video class="absolute top-0 left-0 w-full h-full opacity-0 hover:opacity-100 transition"
          muted loop onmouseover="this.play()" onmouseout="this.pause()">
          <source src="${m.preview}" type="video/mp4">
        </video>

        <p class="mt-2">${m.title}</p>
      </div>
    `;
  });
}

// 🎬 เปิดหน้า player
function openPlayer(video) {
  window.location.href = "player.html?video=" + video;
}

// 🔍 ค้นหา
document.getElementById("search").addEventListener("input", e => {
  const val = e.target.value.toLowerCase();
  const filtered = movies.filter(m => m.title.toLowerCase().includes(val));
  render(filtered);
});

// 🎞️ ฟิลเตอร์
function filter(cat) {
  if(cat === "all") render(movies);
  else render(movies.filter(m => m.category === cat));
}

// โหลดครั้งแรก
render(movies);

</script>

</body>
</html>
