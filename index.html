<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 CINEMA | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #050811; color: white; }
        .movie-gradient { background: linear-gradient(to top, #050811 0%, transparent 100%); }
    </style>
</head>
<body>
    <nav class="fixed w-full z-50 px-6 py-4 flex justify-between items-center bg-black/60 backdrop-blur-md">
        <div class="text-3xl font-black text-blue-500 italic">404<span class="text-white">CINEMA</span></div>
        <div class="hidden md:flex gap-8 text-sm font-light uppercase tracking-widest">
            <a href="index.html" class="text-blue-500">Home</a>
            <a href="action.html" class="hover:text-blue-500 transition">Action</a>
            <a href="vlogs.html" class="hover:text-blue-500 transition">Vlogs</a>
            <a href="shortfilms.html" class="hover:text-blue-500 transition">Short Films</a>
        </div>
    </nav>

    <header class="relative h-screen flex items-end pb-20 px-12">
        <video autoplay muted loop class="absolute inset-0 w-full h-full object-cover opacity-40">
            <source src="https://drive.google.com/uc?export=download&id=1WFCoSWozt4vngbNO4tKQQw-9rytk3qA5" type="video/mp4">
        </video>
        <div class="absolute inset-0 movie-gradient"></div>
        <div class="relative z-10">
            <h1 class="text-7xl font-bold mb-4">WELCOME TO <br><span class="text-blue-500">404 STUDIO</span></h1>
            <button onclick="playMovie('https://drive.google.com/uc?export=download&id=1WFCoSWozt4vngbNO4tKQQw-9rytk3qA5')" class="bg-white text-black px-10 py-3 rounded-md font-bold hover:bg-blue-500 hover:text-white transition">WATCH TRAILER</button>
        </div>
    </header>

    <div id="videoModal" class="hidden fixed inset-0 z-[100] bg-black/95 flex items-center justify-center p-4">
        <div class="relative w-full max-w-5xl">
            <button onclick="closeMovie()" class="absolute -top-10 right-0 text-white text-2xl">✕ Close</button>
            <video id="mainPlayer" controls class="w-full rounded-xl shadow-2xl"></video>
        </div>
    </div>

    <script>
        function playMovie(url) {
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('mainPlayer');
            player.src = url;
            modal.classList.remove('hidden');
            player.play();
        }
        function closeMovie() {
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('mainPlayer');
            modal.classList.add('hidden');
            player.pause();
        }
    </script>
</body>
</html>
